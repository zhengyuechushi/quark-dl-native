name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build PS5 ELF in Docker
        env:
          BUILD_ID: ${{ github.sha }}
        run: bash ps5/build.sh

      - name: Resolve the versioned ELF name
        id: elf
        run: |
          V=$(sed -n 's/^APP_VERSION := //p' Makefile | tr -d ' ')
          test -n "$V"
          echo "name=quark-dl_v$V.elf" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verify ELF shape
        env:
          ELF: ${{ steps.elf.outputs.name }}
          VER: ${{ steps.elf.outputs.version }}
        run: |
          set -e
          test -s "$ELF"
          ls -l "$ELF"
          readelf -h "$ELF" | head -20
          readelf -h "$ELF" | grep -q 'Type:.*DYN' || { echo "not a PIE"; exit 1; }
          if readelf -l "$ELF" | grep -q INTERP; then echo "has INTERP"; exit 1; fi
          grep -aqF "${{ github.sha }}" "$ELF" || { echo "build id missing"; exit 1; }
          grep -aqF "quark-dl.elf" "$ELF" || { echo "process name missing"; exit 1; }
          # The version has to be inside the binary as well as in its name: the
          # name is what Payload Manager shows, the string is what /api/health
          # and the page report, and a build that disagrees with itself is worse
          # than one with no version at all.
          grep -aqF "$VER" "$ELF" || { echo "version string missing"; exit 1; }
          # Stage 2 links TLS and an embedded root store; both must be in the image.
          grep -aqF "mbedtls" "$ELF" || { echo "TLS layer missing"; exit 1; }
          grep -aqF "BEGIN CERTIFICATE" "$ELF" || { echo "root store missing"; exit 1; }
          grep -aqF "/api/dl/add" "$ELF" || { echo "download API missing"; exit 1; }
          # Scan login went in as four endpoints taken from the official bundle;
          # if any of these strings is gone, the flow is gone.
          grep -aqF "uop.quark.cn/cas/ajax/getTokenForQrcodeLogin" "$ELF" || { echo "qr token endpoint missing"; exit 1; }
          grep -aqF "getServiceTicketByQrcodeToken" "$ELF" || { echo "qr poll endpoint missing"; exit 1; }
          grep -aqF "4_eMHBJ" "$ELF" || { echo "qr page missing"; exit 1; }
          grep -aqF "/api/quark/qr" "$ELF" || { echo "qr API missing"; exit 1; }
          # Not "window.qrCode": assets are gzipped before they are embedded, so
          # only the registration path stays readable. The decompressed content is
          # checked by the smoke job, which fetches it over HTTP.
          grep -aqF "/qrcode.js" "$ELF" || { echo "qr renderer missing"; exit 1; }
          # A direct link lives on a CDN that repeats the browser's anti-hotlink
          # checks. Without the client UA and a pan.quark.cn Referer the answer
          # is HTTP 412 even for a link that is seconds old, which is exactly
          # what the console reported before this was added.
          grep -aqF "quark-cloud-drive/" "$ELF" || { echo "download UA missing"; exit 1; }
          grep -aqF "Referer: https://pan.quark.cn/" "$ELF" || { echo "download Referer missing"; exit 1; }
          # A refusal must carry the service's own words, not just the status
          # code: "HTTP 400" alone is what made the folder report unanswerable.
          grep -aqF "（请求被拒）" "$ELF" || { echo "refusal body missing"; exit 1; }
          # The start-up trail. Its absence is how "no process on screen"
          # becomes an unanswerable report.
          grep -aqF "boot.log" "$ELF" || { echo "boot log missing"; exit 1; }
          # The 日志 tab reads the trail through its own endpoint; without it the
          # page's fourth tab would show "还没有日志" forever.
          grep -aqF "/api/log" "$ELF" || { echo "log endpoint missing"; exit 1; }
          # A folder download recreates the tree it came from: a name carrying a
          # relative path must have its parent directory made on the way down.
          # This string is the failure path of that mkdirs.
          grep -aqF "无法创建目录" "$ELF" || { echo "relative-path mkdir missing"; exit 1; }
          # The home-screen entry is registered at runtime (launcher.c), so the
          # ELF must carry the description, the icon and the titleId. /api/open-ui
          # stays as the remote path for bringing the page up on the TV.
          grep -aqF "/api/open-ui" "$ELF" || { echo "open-ui endpoint missing"; exit 1; }
          grep -aqF "sceSystemServiceLaunchWebBrowser" "$ELF" || { echo "browser launcher missing"; exit 1; }
          echo "ok"

      - name: Verify the home-screen entry payload
        env:
          ELF: ${{ steps.elf.outputs.name }}
        run: |
          set -e
          # The entry is a web-app shortcut written by the payload itself into
          # /user/app/<TITLEID>/sce_sys and then handed to AppInstUtil. Nothing
          # here is signed: the console's own installer does the work.
          grep -aqF '"applicationCategoryType": 65536' "$ELF" || { echo "param.json not embedded"; exit 1; }
          grep -aqF '"deeplinkUri": "http://127.0.0.1:8520/"' "$ELF" || { echo "deeplink missing"; exit 1; }
          grep -aqF '/user/app/QDLK85200' "$ELF" || { echo "launch dir missing"; exit 1; }
          # icon0.png is .incbin'd whole, so the PNG signature must be readable.
          grep -aqF "PNG" "$ELF" || { echo "icon0.png not embedded"; exit 1; }
          # The titleId in the binary and in param.json must agree, or the entry
          # is installed under one id and updated under another.
          T=$(grep -o '"titleId": *"[A-Z0-9]*"' assets/param.json | grep -o '"[A-Z0-9]\{9\}"' | head -1 | tr -d '"')
          echo "titleId in param.json: $T"
          test "$T" = QDLK85200
          grep -aqF "$T" "$ELF" || { echo "titleId not embedded"; exit 1; }
          # PS5 wants a square 512x512 icon. Checked on the source asset because
          # that is the byte-for-byte copy that ends up on the console.
          python3 - assets/icon0.png <<'PY'
          import struct, sys
          with open(sys.argv[1], 'rb') as f:
              head = f.read(33)
          w, h = struct.unpack('>II', head[16:24])
          assert (w, h) == (512, 512), 'icon0.png is %dx%d' % (w, h)
          print('icon0.png 512x512')
          PY
          echo ok

      - uses: actions/upload-artifact@v4
        with:
          name: quark-dl-elf
          path: ${{ steps.elf.outputs.name }}
          if-no-files-found: error

  # The console-specific parts (SYS_thr_set_name, sysctl, notifications) cannot be
  # tested off-hardware. Everything else — routing, JSON, static assets, the exit
  # path that ends main, the download engine and the TLS handshake — runs
  # identically on the host build, so it is tested here instead of being
  # discovered on the console.
  linux-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmicrohttpd-dev openssl

      - name: Build mbedTLS for the host
        run: |
          MBEDTLS_PREFIX="$HOME/mbedtls" MBEDTLS_CC=cc MBEDTLS_AR=ar \
            MBEDTLS_RANLIB=ranlib bash install-mbedtls.sh
          ls -l "$HOME/mbedtls/lib"

      - name: Build host binary
        run: make linux BUILD_ID=smoke TLS_PREFIX="$HOME/mbedtls"

      # The download engine needs the session, and it gets it through exactly one
      # call. A handler that loads the session on its own would leave the queue
      # without a cookie: the login works, the link resolves, and the download is
      # refused with 412 - three symptoms that all look like something else.
      #
      # Since links are minted lazily, the cookie flows through the queue itself:
      # quark_direct_fresh loads the session and rotates the jar, and dl_attempt
      # publishes the newest value with dl_set_cookie right after it mints a link.
      - name: Session cookie reaches the queue
        run: |
          set -e
          if grep -n "quark_load(&s)" src/api.c; then
            echo "a handler loads the session without publishing it"
            exit 1
          fi
          grep -q "session_load(&s)" src/api.c
          grep -q "quark_download_cookie" src/dl.c
          grep -q "dl_set_cookie" src/dl.c
          grep -q "quark_direct_fresh" src/dl.c
          echo ok

      # The download endpoint keys its size limit on the User-Agent: a request
      # with the web UA is refused with 23018 "download file size limit" the
      # moment a file is big enough, while the desktop client UA is let through.
      # The direct-link calls must therefore ask call() for the client UA; a
      # regression back to the web UA would silently cap the user at small files
      # exactly like the 4 GB report this guards against.
      - name: Direct-link fetch uses the client UA
        run: |
          set -e
          # call() gains a client_ua flag and the two direct-link call sites
          # (quark_direct and dl_fetch) must pass 1 as its final argument.
          grep -q "int client_ua" src/quark.c
          n=$(grep -c 'errcap, 1)' src/quark.c)
          test "$n" = "2"
          echo ok

      # Pause keeps the .part (resumable) and cancel removes it (destructive), so
      # they are two different verbs, not one. A cancel that silently kept the
      # half file is the bug a user reads as "I canceled but the bytes are still
      # taking space", and a pause that deleted it is "I paused and lost progress".
      # The queue must expose both, plus resume, and the endpoints must route them.
      - name: Pause and cancel are distinct
        run: |
          set -e
          grep -q "int dl_pause(int id)" src/dl.h
          grep -q "int dl_resume(int id)" src/dl.h
          grep -q "DL_PAUSED" src/dl.h
          grep -q "unlink(part)" src/dl.c
          grep -q '"/api/dl/pause"' src/api.c
          grep -q '"/api/dl/resume"' src/api.c
          grep -q "int dl_set_limit(int src, int n)" src/dl.h
          echo ok

      # A small body reader forces one read() + write() system call per fill,
      # which a big file turns into a quarter million of each and crawls while a
      # small file finishes in a blink. mbedtls_ssl_read hands back one 16 KB TLS
      # record per call, so net_read must loop until the large block is full, and
      # that block must match the 256 KB chunk the working exFAT build uses. The
      # reader must stay on the large scratch buffer, never shrink to a stack
      # array, and never fall back to a per-record write loop.
      - name: Body reader fills a large block before writing
        run: |
          set -e
          grep -q "unsigned char body\[256 \* 1024\]" src/httpc.c
          grep -q "r.cap = sizeof(sc->body)" src/httpc.c
          grep -q "while(got < len)" src/net.c
          grep -q "got += (size_t)rc" src/net.c
          grep -q "SO_RCVBUF" src/net.c
          grep -q "1024 \* 1024" src/net.c
          echo ok

      # A Quark CDN throttles a single connection, so a big file crawled at
      # ~100 KB/s while the working exFAT build saturated the link by fetching
      # 32 MiB ranges over 8 parallel connections. The segmented path must stay:
      # the range size, the connection cap, the probe that learns the size, the
      # per-range worker, and the pwrite to each range's offset.
      - name: Big files download over parallel ranges
        run: |
          set -e
          grep -q "SEG_BYTES" src/dl.h
          grep -q "SEG_CONNS" src/dl.h
          grep -q "SEG_MIN_BYTES" src/dl.h
          grep -q "dl_segmented" src/dl.c
          grep -q "dl_probe_total" src/dl.c
          grep -q "range_end" src/httpc.h
          grep -q "pwrite(r->fd, p, len" src/dl.c
          grep -q "Range: bytes=%lld-%lld" src/httpc.c
          echo ok

      # Direct links are minted when a download starts, not when a folder is
      # added: a file queued behind several 4 GB downloads would otherwise be
      # handed a signature that expires before its turn (HTTP 412). The queue
      # stores the fid and dl_attempt refreshes the link, serialised so the
      # shared HTTP scratch is not rewritten by two workers at once.
      - name: Links are minted lazily at download time
        run: |
          set -e
          grep -q "char fid\[QUARK_FID_MAX\]" src/dl.c
          grep -q "quark_direct_fresh" src/quark.c
          grep -q "pthread_mutex_lock(&g_call_lock)" src/quark.c
          grep -q "quark_direct_fresh(t->fid" src/dl.c
          # the add handler queues by fid, never pre-resolves the whole folder
          grep -q "dl_add(NULL, arr\[i\].fid" src/api.c
          # the persisted queue carries the fid field
          grep -q "t->fid, t->url" src/dl.c
          echo ok

      # The home-screen icon is produced by the payload registering a web-app
      # entry with the console's own installer, not by shipping a signed
      # eboot.bin. Both halves matter: without the write the entry has no icon,
      # without the AppInstUtil call the files sit in /user/app unregistered.
      - name: Home-screen entry is registered at runtime
        run: |
          set -e
          grep -q "src/launcher.c" Makefile
          grep -q 'LAUNCH_DIR "/sce_sys"' src/launcher.c
          grep -q "libSceAppInstUtil.sprx" src/launcher.c
          grep -q "Wudg3Xe3heE" src/launcher.c
          grep -q "sceAppInstUtilInitialize" src/launcher.c
          grep -q "assets/param.json" src/launcher.c
          grep -q "assets/icon0.png" src/launcher.c
          grep -q '^TITLE_ID    := QDLK85200' Makefile
          grep -q '"titleId": "QDLK85200"' assets/param.json
          grep -q '"deeplinkUri": "http://127.0.0.1:8520/"' assets/param.json

          # 0.12.0 把注册同步放在 websrv_listen() 之前，真机上的结果是整个
          # payload 都没起来：没有通知、8520 不通。安装器是系统调用，可能几十
          # 秒不返回，所以只能跑在后台线程里，而且要排在"端口是多少"之后。
          grep -q "pthread_create" src/launcher.c
          grep -q "PTHREAD_CREATE_DETACHED" src/launcher.c
          grep -q "launcher_start(port)" src/main.c
          grep -q "launcher_serve_icon()" src/main.c
          ! grep -q "launcher_install_if_needed" src/main.c src/launcher.c

          # The serving path, in order: bind the port, tell the user, register
          # the icon off-thread, then serve. Nothing blocking may sit between
          # the port being chosen and websrv_listen.
          awk '/api_set_port\(port\)/,/websrv_listen\(port\)/' src/main.c > /tmp/serve_path.c
          grep -q "notify_user" /tmp/serve_path.c
          grep -q "launcher_start(port)" /tmp/serve_path.c
          N=$(grep -n "notify_user" /tmp/serve_path.c | head -1 | cut -d: -f1)
          L=$(grep -n "launcher_start(port)" /tmp/serve_path.c | cut -d: -f1)
          test "$N" -lt "$L" || { echo "notification must precede the launcher"; exit 1; }
          echo ok

      # 0.12.2 把默认下载目录从 /data/homebrew 挪到它下面单独的子目录：
      # 那个目录装的是 payload 本体，把片子混进去两边都不好读。
      - name: Default download directory
        run: |
          set -e
          grep -q '#define DL_DEFAULT_DIR "/data/homebrew/Quarkdownload"' src/dl.h
          grep -q '#define DL_LEGACY_DIR "/data/homebrew"' src/dl.h
          # 老 settings.txt 里恰好等于旧默认值的要迁移；用户自己填过的目录不动。
          grep -q 'strcmp(v, DL_LEGACY_DIR)' src/dl.c
          # 迁移结果要落盘，否则每次启动都得再算一遍。
          grep -q '^  save_settings();' src/dl.c
          # 页面上不能再出现旧的默认值（新的那个是它的子目录，所以要比全串）。
          ! grep -q "placeholder=\"/data/homebrew\"" assets/index.html
          ! grep -q "'/data/homebrew'" assets/index.html
          grep -q '/data/homebrew/Quarkdownload' assets/index.html
          echo ok

      # "目录不可写" was reported for a folder that was downloading files at that
      # very moment: access(W_OK) says EACCES on this console's /data mount where
      # open(O_CREAT) succeeds. The check has to be the write itself, and the
      # folders/files we create have to be 0777 like the rest of /data/homebrew
      # (mkdir/open both get masked by the umask).
      - name: Download directory is checked by writing into it
        run: |
          set -e
          ! grep -q 'access(dir, W_OK)' src/dl.c
          grep -q 'dir_writable(dir, &why)' src/dl.c
          grep -q 'O_WRONLY | O_CREAT | O_EXCL' src/dl.c
          grep -q 'chmod(dir, 0777)' src/dl.c
          grep -q 'fchmod(fd, 0777)' src/dl.c
          grep -q 'mkdir(tmp, 0777)' src/dl.c
          echo ok

      # The page ships inside the ELF, so what it does is invisible until it is
      # on a console - and "I picked a file, pressed the button, nothing
      # happened" is exactly the report that blind spot produces. This runs the
      # shipped script against a stub DOM and asserts what the user would see
      # after each press. No build needed, so it fails fast.
      - name: Page behaviour
        run: node tools/test-page.mjs

      # The stub DOM in test-page.mjs is built from ids, so it cannot see where an
      # element sits. Reading order matters here: the queue button has to sit
      # between the paste box and 保存到 (paste, then press), and the two directory
      # buttons have to come after the directory input they act on.
      - name: Direct-link pane layout
        run: |
          set -e
          python3 - <<'PY'
          import io
          s = io.open('assets/index.html', encoding='utf-8').read()
          pane = s[s.index('id="pane-dl"'):]
          i_urls = pane.index('id="urls"')
          i_add = pane.index('id="add"')
          i_dir = pane.index('id="dir2"')
          i_save = pane.index('id="saveDir2"')
          i_clear = pane.index('id="clear2"')
          assert i_urls < i_add < i_dir, '加入下载队列 必须在粘贴框和 保存到 之间'
          assert i_dir < i_save and i_dir < i_clear, '记住这个目录/清掉已完成 必须在目录框之后'
          print('ok')
          PY

      # One queue in the engine, two lists on screen. The list has to say which
      # half a task belongs to and clearing has to be able to name one half,
      # otherwise the two pages would show (and wipe) each other's tasks.
      # The task list is shared, but the download slots are not: a drive batch
      # must never park a pasted link. Two counters, each guarded on its own,
      # and a selector per page that names the half it is changing.
      - name: Queue is one list, two views
        run: |
          set -e
          python3 - <<'PY'
          import io
          dl = io.open('src/dl.c', encoding='utf-8').read()
          api = io.open('src/api.c', encoding='utf-8').read()
          hdr = io.open('src/dl.h', encoding='utf-8').read()
          htm = io.open('assets/index.html', encoding='utf-8').read()
          assert 'task_src(t) == DL_SRC_DRIVE ? "drive" : "link"' in dl, 'list does not report src'
          assert 'dl_clear_finished(which)' in api, 'clear is not restricted to one half'
          assert 'MHD_GET_ARGUMENT_KIND, "src"' in api, 'clear does not read ?src='
          assert "el('tasks2')" in htm, 'direct-link page has no queue container'
          assert "all[i].src === 'link'" in htm, 'page does not split by src'
          assert "?src=' + src" in htm, 'clear button does not name its half'
          assert 'static int g_limit[2]' in dl, 'concurrency is one shared budget again'
          assert 'if(g_running[slot] >= g_limit[slot])' in dl, 'pump ignores the per-source budget'
          assert 'static int g_running[2]' in dl, 'running count is global again'
          assert 'int dl_set_limit(int src, int n)' in hdr, 'set_limit lost its source argument'
          assert 'int dl_limit(int src)' in hdr, 'limit lost its source argument'
          assert 'id="limitSel2"' in htm, 'direct-link page has no concurrency selector'
          assert "src=' + src + '&limit=" in htm, 'selector does not name its half'
          print('ok')
          PY

      - name: Endpoints and clean exit
        run: |
          set -e
          PORT=8520
          base="http://127.0.0.1:$PORT"
          QDL_DATA_DIR="$PWD/.smoke-data" QDL_DEFAULT_DIR="$PWD/.smoke-dl" \
            ./quark-dl-linux > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS "$base/api/health" > /dev/null 2>&1; then break; fi
            sleep 0.5
          done

          echo "--- health ---"
          curl -fsS "$base/api/health" | tee health.json
          echo
          grep -q '"ok":true' health.json
          grep -q '"build":"smoke"' health.json
          grep -q '"port":8520' health.json

          # Two concurrency budgets, not one. Each page's selector changes only
          # its own half and the choice is written to settings.txt, so a restart
          # does not silently drop it back to the default. A shared counter is
          # exactly what made a pasted link sit at 0% behind a drive batch.
          echo "--- concurrency budget is per source ---"
          curl -fsS -X POST --data 'src=link&limit=4' "$base/api/settings" | tee set-link.json
          echo
          grep -q '"limit_link":4' set-link.json
          grep -q '"limit_drive":2' set-link.json

          curl -fsS -X POST --data 'src=drive&limit=3' "$base/api/settings" > set-drive.json
          cat set-drive.json
          echo
          curl -fsS "$base/api/dl/list" | tee dl-list.json
          echo
          grep -q '"limit_drive":3' dl-list.json
          grep -q '"limit_link":4' dl-list.json
          grep -q '^limit_drive=3$' .smoke-data/settings.txt
          grep -q '^limit_link=4$' .smoke-data/settings.txt

          echo "--- a settings post that changes nothing is refused ---"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST --data 'x=1' "$base/api/settings")
          echo "status $code"
          test "$code" = 400

          echo "--- diag as json (what scripts get) ---"
          curl -fsS "$base/api/diag?format=json" | tee diag.json
          echo
          grep -q '"expected":"quark-dl.elf"' diag.json
          grep -q '"port":8520' diag.json
          grep -q '"host":"127.0.0.1:8520"' diag.json
          grep -q '"tls":"mbedtls' diag.json
          curl -sS -D ct-json.txt -o /dev/null "$base/api/diag"
          grep -qi '^content-type: application/json' ct-json.txt

          # The console run had this exact split: the page worked, typing the URL
          # did not. Content type and path normalisation are what differ.
          echo "--- diag as a page (what a browser gets) ---"
          curl -fsS -H 'Accept: text/html' "$base/api/diag" > diag.html
          curl -sS -D ct-html.txt -o /dev/null -H 'Accept: text/html' "$base/api/diag"
          grep -qi '^content-type: text/html' ct-html.txt
          grep -q '<title>Quark DL' diag.html
          grep -q 'quark-dl.elf' diag.html

          echo "--- diag keeps working with a query or a trailing slash ---"
          curl -fsS "$base/api/diag?x=1" > /dev/null
          curl -fsS "$base/api/diag/" > /dev/null
          curl -fsS -H 'Accept: text/html' "$base/api/diag?format=json" | head -c 20 | grep -q '{'

          echo "--- diag as plain text ---"
          curl -fsS "$base/api/diag.txt" | tee diag.txt
          grep -q 'quark-dl.elf' diag.txt

          echo "--- unknown endpoint is a 404, not a hang ---"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/nope")
          echo "status $code"
          test "$code" = 404

          echo "--- index ---"
          curl -fsS "$base/" | head -c 120
          echo

          # The QR renderer is a second script; a 404 here is a blank scan panel
          # with no error anywhere in sight.
          echo "--- qrcode.js ---"
          # --compressed matters: assets are stored gzipped and served with
          # Content-Encoding, so a plain curl writes bytes that grep cannot see.
          curl -fsS --compressed -D qr-ct.txt -o qrcode.js "$base/qrcode.js"
          grep -qi "javascript" qr-ct.txt
          grep -q "window.qrCode" qrcode.js
          curl -fsS --compressed "$base/" > index.html
          grep -q '/qrcode.js' index.html

          # The scan card was reported missing by a user who was looking at a
          # page the browser had cached from an older build. Both halves are
          # asserted now: the card is in the page, and the page cannot be cached.
          echo "--- scan card and cache headers ---"
          grep -q '<h2>夸克账号</h2>' index.html
          grep -q 'id="qQr"' index.html
          grep -q 'var PAGE_V' index.html
          curl -sS -D index-hdr.txt -o /dev/null "$base/"
          grep -qi '^cache-control: no-store' index-hdr.txt
          curl -sS -D diag-hdr.txt -o /dev/null "$base/api/diag?format=json"
          grep -qi '^cache-control: no-store' diag-hdr.txt

          # The page carries its own version so it can tell a stale copy from a
          # build that really lacks a feature. If it drifts from the binary the
          # warning turns into noise, so the drift fails the build.
          echo "--- page version matches the binary ---"
          WANT=$(sed -n 's/^APP_VERSION := //p' Makefile | tr -d ' ')
          grep -qF "var PAGE_V = '$WANT'" index.html || {
            echo "index.html PAGE_V does not match APP_VERSION=$WANT"; exit 1; }

          echo "--- boot log ---"
          # The start-up trail is the only evidence a user has when the console
          # shows no process. If it stops being written, that report becomes
          # unanswerable again.
          test -f .smoke-data/boot.log
          cat .smoke-data/boot.log
          grep -q "ELF 已加载" .smoke-data/boot.log
          grep -q "main 进入" .smoke-data/boot.log
          grep -q "api_init 完成" .smoke-data/boot.log
          grep -q "监听端口 8520" .smoke-data/boot.log
          # Smoke has no login, so the queue must say so out loud. A silent
          # "no cookie" is what produced 412s that took a build to diagnose.
          grep -q "下载登录头：没有会话" .smoke-data/boot.log

          # The 日志 tab reads the same trail over HTTP. If the endpoint stops
          # serving it, the tab shows "还没有日志" and the trail is useless.
          echo "--- log endpoint serves the trail ---"
          curl -fsS "$base/api/log" | tee api-log.txt
          grep -q "ELF 已加载" api-log.txt

          # The queue button used to fail silently: the handler wrote no trace,
          # and the page printed its answer into a different card. Both halves
          # are asserted here - the request reaches the handler, and the handler
          # says where it stopped. Not logged in is the expected answer in
          # smoke, which makes it a stable, cookie-free check of the whole path
          # (routing, body collection, url-decoding of tab-separated items).
          echo "--- add endpoint reaches the handler ---"
          curl -sS -X POST --data 'items=abc%09file.bin%09f' "$base/api/quark/add"
          echo
          grep -q "add: 收到请求" .smoke-data/boot.log
          grep -q "add: 会话无效" .smoke-data/boot.log

          echo "--- queue feedback lives in the browse card ---"
          grep -q 'id="qAddMsg"' index.html
          grep -q 'function qaMsg' index.html

          echo "--- exit ---"
          curl -fsS -X POST "$base/api/exit"
          echo

          for i in $(seq 1 20); do
            if ! kill -0 "$PID" 2>/dev/null; then echo "process exited"; exit 0; fi
            sleep 0.5
          done
          echo "process did not exit after /api/exit"
          cat server.log
          exit 1

      # Downloads, resume, chunked decoding and certificate verification. This is
      # the whole reason the engine lives in plain C with its own HTTP client: it
      # can be run against a server that misbehaves on purpose.
      - name: Download engine and TLS
        run: bash tools/test-stage2.sh

      # The JSON reader cannot be exercised against the real service without a
      # cookie, and a broken parser fails exactly like a wrong field name does:
      # an empty directory. So it gets tested on its own, against the shapes the
      # API returns and the malformed ones it must refuse.
      - name: JSON parser
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc -o /tmp/test-json \
             tools/test-json.c src/json.c
          /tmp/test-json

      # The cookie parser is what stands between a user and a working login.
      # It cannot be tested against a live account, and every way it can be
      # wrong looks the same from the outside: a 401 that reads as "not logged
      # in" rather than "the paste was mangled".
      - name: Cookie paste and jar
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc -o /tmp/test-cookie \
             tools/test-cookie.c src/cookie.c
          /tmp/test-cookie

      - name: Log on failure
        if: failure()
        run: |
          cat server.log || true
          for f in health.json diag.json diag.html diag.txt ct-json.txt ct-html.txt; do
            echo "=== $f ==="; cat "$f" 2>/dev/null || true
          done
